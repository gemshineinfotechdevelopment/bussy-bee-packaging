# ==============================================================================
# Nginx Configuration for Bussy Bee Packaging Application
# Domain: bussy-bee (or your domain / VPS IP)
# Public Access Port: 5035
# ==============================================================================

server {
    # Listen on port 5035 (both IPv4 and IPv6)
    listen 5035;
    listen [::]:5035;

    # Domain name (replace with your actual domain or IP)
    server_name bussy-bee www.bussy-bee localhost _;

    # Maximum request body size (allows uploading invoices / attachments up to 50MB)
    client_max_body_size 50M;

    # Path to the compiled frontend production build (Vite outDir)
    root /var/www/bussy-bee/dist;
    index index.html;

    # Logs
    access_log /var/log/nginx/bussy-bee-access.log;
    error_log /var/log/nginx/bussy-bee-error.log warn;

    # Gzip Compression for ultra-fast static file loading
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # --------------------------------------------------------------------------
    # 1. API Reverse Proxy -> Node.js Backend Server (PM2 on Port 5004)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:5004;
        proxy_http_version 1.1;

        # WebSocket & connection upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Forwarded Client Headers
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts for heavy PDF generation / reports
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # 2. Static Assets Caching (Vite hashed bundles in /assets/)
    # --------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Favicon and Robots
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # --------------------------------------------------------------------------
    # 3. Single Page Application (SPA) HTML5 History Fallback
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
